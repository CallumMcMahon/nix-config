services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_PORT=5678
      - N8N_HOST=0.0.0.0
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.callums-server.co.uk/
    volumes:
      - /Volumes/mini4/n8n:/home/node/.n8n
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
